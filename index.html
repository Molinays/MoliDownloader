<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoliDowloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- SFONDO: SOLO GRIGLIA + PARTICELLE (rimosse le glow-orb) -->
  <div class="grid-bg"></div>
  <div id="particles-container"></div>

  <!-- APP -->
  <div class="app">
    <header>
      <div class="logo">
        <img src="https://cdn.simpleicons.org/mpv/000000" alt="logo" width="20">
      </div>
      <span class="logo-text">MoliDowloader</span>
      <span class="badge">powered by YT-DLP</span>
      <span id="statusDot" class="status-dot" title="Server OK"></span>
    </header>

    <main>
      <!-- LEFT: Download Form -->
      <div class="left">
        <!-- URL -->
        <div class="url-card">
          <div class="url-row">
            <input id="urlInput" class="url-input" type="text" placeholder="Incolla URL YouTube, Vimeo, Twitter, ecc..."
              autocomplete="off" spellcheck="false">
            <button id="dlBtn" class="btn-dl" onclick="startDownload()">Download</button>
          </div>
        </div>

        <!-- Format tabs -->
        <div class="tabs">
          <button class="tab active" id="tabVideo" onclick="setTab('video')">Video</button>
          <button class="tab" id="tabAudio" onclick="setTab('audio')">Audio</button>
        </div>

        <!-- Video settings -->
        <div id="videoSettings">
          <div class="section-title">Qualità Video</div>
          <div class="settings-grid">
            <div class="field">
              <label>Qualità</label>
              <select id="quality">
                <option value="best">Best (automatico)</option>
                <option value="2160">4K (2160p)</option>
                <option value="1440">QHD (1440p)</option>
                <option value="1080" selected>Full HD (1080p)</option>
                <option value="720">HD (720p)</option>
                <option value="480">SD (480p)</option>
                <option value="360">Low (360p)</option>
              </select>
            </div>
            <div class="field">
              <label>Cartella output</label>
              <div class="folder-row">
                <input id="outputDir" type="text" placeholder="~/Downloads">
                <button class="btn-icon" onclick="pickFolder()" title="Sfoglia">Sfoglia</button>
              </div>
            </div>
            <div class="field full">
              <label>Template nome file</label>
              <input id="outputTmpl" type="text" value="%(title)s.%(ext)s" placeholder="%(title)s.%(ext)s">
            </div>
          </div>

          <div class="section-title">Sottotitoli</div>
          <div class="settings-grid">
            <div class="field">
              <label>Lingue sottotitoli</label>
              <input id="subLangs" type="text" value="en,it" placeholder="en,it,fr">
            </div>
          </div>
        </div>

        <!-- Audio settings -->
        <div id="audioSettings" style="display:none">
          <div class="section-title">Formato Audio</div>
          <div class="settings-grid">
            <div class="field">
              <label>Formato</label>
              <select id="audioFormat">
                <option value="mp3" selected>MP3</option>
                <option value="m4a">M4A (AAC)</option>
                <option value="opus">Opus</option>
                <option value="flac">FLAC</option>
                <option value="wav">WAV</option>
                <option value="best">Best (no convert)</option>
              </select>
            </div>
            <div class="field">
              <label>Bitrate</label>
              <select id="audioQuality">
                <option value="320">320 kbps</option>
                <option value="256">256 kbps</option>
                <option value="192" selected>192 kbps</option>
                <option value="128">128 kbps</option>
                <option value="96">96 kbps</option>
              </select>
            </div>
            <div class="field full">
              <label>Cartella output</label>
              <div class="folder-row">
                <input id="outputDirAudio" type="text" placeholder="~/Downloads">
                <button class="btn-icon" onclick="pickFolder('audio')" title="Sfoglia">📁</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Toggles -->
        <div class="section-title">Opzioni</div>
        <div class="toggles-grid">
          <div class="toggle-item">
            <span class="toggle-label">Playlist</span>
            <label class="toggle"><input type="checkbox" id="playlist"><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">Sottotitoli</span>
            <label class="toggle"><input type="checkbox" id="subtitles"><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">Embed sottotitoli</span>
            <label class="toggle"><input type="checkbox" id="embedSubs"><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">Embed copertina</span>
            <label class="toggle"><input type="checkbox" id="embedThumb" checked><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">Embed metadata</span>
            <label class="toggle"><input type="checkbox" id="metadata" checked><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">SponsorBlock</span>
            <label class="toggle"><input type="checkbox" id="sponsorblock"><span class="slider"></span></label>
          </div>
          <div class="toggle-item">
            <span class="toggle-label">Geo bypass</span>
            <label class="toggle"><input type="checkbox" id="geoBypass"><span class="slider"></span></label>
          </div>
        </div>

        <!-- Advanced -->
        <div class="section-title">Avanzate</div>
        <div class="settings-grid">
          <div class="field">
            <label>Rate limit</label>
            <input id="rateLimit" type="text" placeholder="es. 5M, 1.5M">
          </div>
          <div class="field">
            <label>Retries</label>
            <input id="retries" type="number" value="10" min="1" max="99">
          </div>
          <div class="field">
            <label>Frammenti paralleli</label>
            <input id="concurrentFragments" type="number" value="4" min="1" max="16">
          </div>
          <div class="field">
            <label>Cookie da browser</label>
            <select id="cookiesFrom">
              <option value="">Nessuno</option>
              <option value="chrome">Chrome</option>
              <option value="firefox">Firefox</option>
              <option value="edge">Edge</option>
              <option value="brave">Brave</option>
              <option value="opera">Opera</option>
            </select>
          </div>
          <div class="field full">
            <label>Proxy (opzionale)</label>
            <input id="proxy" type="text" placeholder="socks5://127.0.0.1:1080">
          </div>
        </div>
      </div>

      <!-- RIGHT: Jobs -->
      <div class="right">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2 style="font-size:15px;font-weight:600">Download attivi</h2>
          <button class="btn-icon" style="font-size:12px;padding:6px 10px" onclick="clearDone()">Pulisci</button>
        </div>

        <div id="jobsList" class="jobs-list">
          <div class="empty-state"><span class="empty-icon">📭</span>Nessun download ancora</div>
        </div>

        <!-- Quick info -->
        <div class="panel-section" style="margin-top:auto">
          <h3>Info</h3>
          <div style="font-size:12px;color:var(--text3);display:flex;flex-direction:column;gap:6px">
            <div>Programma: <span id="exeStatus" style="color:var(--text2)">...</span></div>
            <div>Porta: <span style="color:var(--text2)">7979</span></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Log Modal -->
  <div id="logModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Log download</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div id="logBox" class="log-box">Caricamento...</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Script particelle -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('particles-container');
      const particleCount = 60;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const size = Math.random() * 2 + 1;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;

        const duration = Math.random() * 12 + 6;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${Math.random() * 10}s`;
        particle.style.opacity = Math.random() * 0.5 + 0.1;

        container.appendChild(particle);
      }
    });
  </script>

  <!-- Il tuo script originale -->
  <script src="/app.js"></script>
</body>

</html>
